; https://docs.platformio.org/page/projectconf.html

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

; Имена окружений (esp32, esp32c3, esp12e) должны совпадать с именами
; файлов в релизе: firmware-<env>.bin

[env:esp32]
platform = espressif32
board = esp32dev
; две OTA-партиции по ~1.9 МБ вместо 1.3 МБ (прошивка с TLS + веб-сервером не влезает в default)
board_build.partitions = min_spiffs.csv

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp12e]
platform = espressif8266
board = esp12e
